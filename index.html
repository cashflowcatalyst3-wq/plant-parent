<body>
<script>
  (function () {
    try {
      var theme = localStorage.getItem('plant-parent-theme') || 'sage';
      document.body.dataset.theme = theme;
      var storedDark = localStorage.getItem('plant-parent-dark-mode');
      var dark = storedDark !== null
        ? storedDark === '1'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.body.dataset.mode = dark ? 'dark' : 'light';
    } catch (err) {}
  })();
</script>
<div id="loadingScreen">
  <div class="loading-flourish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11C12 11 6 11 6 5C12 5 12 11 12 11Z"/><path d="M12 13C12 13 18 13 18 7C12 7 12 13 12 13Z"/><path d="M7 21H17"/></svg></div>
  <div class="loading-title"><span class="brand-plant">Plant</span> <span class="brand-parent">Parent</span></div>
  <div class="loading-spinner"></div>
</div>
<div class="app" id="app"></div>

<script src="app.js?v=6"></script>
<script src="game.js?v=6"></script>
<script src="game2.js?v=6"></script>
<script>
  setTimeout(function () {
    var el = document.getElementById('loadingScreen');
    if (el) el.remove();
  }, 6000);
</script>
</body>
